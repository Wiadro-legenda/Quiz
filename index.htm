<style>
    /* === CSS GLOBALNY === */
    body {
        transition: background-color 1s ease, filter 2s ease;
        overflow-x: hidden;
        margin: 0;
        background-color: #000;
    }

    /* Ukrycie scrollbara */
    ::-webkit-scrollbar { width: 0; background: transparent; }

    /* === FAZA 1: FESTIVE (Pytania 1-10) === */
    body.theme-festive {
        background: radial-gradient(circle at 50% 30%, #1a4d2e 0%, #051b14 100%);
        font-family: 'Playfair Display', serif;
        color: #f0fdf4;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    /* Śnieg */
    .snowflake {
        position: fixed; top: -10px; color: rgba(255, 255, 255, 0.4);
        pointer-events: none; animation: fall linear infinite; z-index: 1;
    }
    @keyframes fall { to { transform: translateY(110vh); } }

    /* === FAZA 2: HORROR (Pytania 11-20) === */
    /* Zmniejszona ilość kolorów, mrok */
    body.theme-horror {
        background-color: #0a0a0a;
        font-family: 'Share Tech Mono', monospace;
        color: #888;
        /* Kluczowa zmiana: desaturacja (wyszarzenie) */
        filter: grayscale(90%) contrast(110%) brightness(60%);
    }

    .horror-text {
        text-shadow: 0 0 5px rgba(255, 255, 255, 0.1);
    }

    /* === FAZA 3: TERMINAL / GLITCH (Pytania 21+) === */
    body.theme-terminal {
        background-color: #000;
        font-family: 'VT323', monospace;
        color: #ff0000;
        filter: contrast(150%) brightness(100%);
    }

    /* Agresywny efekt dla ostatnich pytań */
    .extreme-glitch {
        animation: extreme-shake 0.3s cubic-bezier(.36,.07,.19,.97) both infinite, rgb-split 0.2s steps(2) infinite;
    }

    @keyframes extreme-shake {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(5px, 5px) rotate(1deg); }
        50% { transform: translate(0, 0) rotate(0deg); }
        75% { transform: translate(-5px, 5px) rotate(-1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes rgb-split {
        0% { text-shadow: -2px 0 #00ffea, 2px 2px #ff003c; }
        25% { text-shadow: 2px 0 #00ffea, -2px -2px #ff003c; }
        50% { text-shadow: -1px 0 #00ffea, 1px 1px #ff003c; }
        75% { text-shadow: 1px 0 #00ffea, -1px -1px #ff003c; }
        100% { text-shadow: -2px 0 #00ffea, 2px 2px #ff003c; }
    }

    /* Przejście (Glitch Overlay) */
    .glitch-layer {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 9999; display: none;
    }
    .glitch-active {
        display: block;
        animation: flash-glitch 0.3s infinite;
    }
    @keyframes flash-glitch {
        0% { opacity: 1; transform: scale(1.1); filter: invert(0); }
        50% { opacity: 0.8; transform: scale(1); filter: invert(1); }
        100% { opacity: 1; transform: scale(1.2); filter: invert(0); }
    }

    /* Ukryty kontener YouTube */
    #youtube-audio { display: none; }

        { text: "Karp", options: ["tradycja", "ohyda", "biedna ryba", "narzędzie chaosu"] },
        { text: "Czy choinka powinna być prawdziwa", options: ["tak", "nie", "jak spadnie z lasu to moja", "wszystko jedno"] },
        { text: "Prezenty", options: ["dawać", "dostawać", "udawać że się cieszysz", "nie zasługuję"] },
        { text: "Kiedy zaczynasz pić w Wigilię", options: ["po kolacji", "w trakcie", "przed", "nie przestaję od zeszłego roku"] },
        { text: "Kolędy", options: ["lubię", "toleruję", "wyłączam", "słyszę je nawet gdy ich nie ma"] },
        { text: "Pasterka", options: ["idę", "nie idę", "byłem kiedyś", "stoję pod kościołem i palę"] },
        { text: "Wigilia to dla ciebie", options: ["radość", "obowiązek", "teatr", "checkpoint przed końcem roku"] },
        { text: "Czy czujesz ulgę gdy święta się kończą", options: ["tak", "bardzo", "nie wiem", "one się nigdy nie kończą"] },
        
        // 11-20 (Horror - cicho, bez kolorów)
        { text: "Kiedy ostatni raz naprawdę czułeś spokój", options: ["w dzieciństwie", "niedawno", "nie pamiętam", "nigdy"] },
        { text: "Czy przy stole świątecznym mówisz to co myślisz", options: ["tak", "czasem", "nigdy", "oni i tak by nie zrozumieli"] },
        { text: "Gdyby Przepotężne Wiadro zapytało cię o winy odpowiedziałbyś", options: ["szczerze", "półprawdą", "żartem", "milczeniem"] },
        { text: "Czy boisz się ciszy", options: ["nie", "trochę", "bardzo", "ona mówi za dużo"] },
        { text: "Co robisz gdy wszyscy już śpią", options: ["idę spać", "siedzę w telefonie", "piję", "myślę za dużo"] },
        { text: "Czy ktoś przy tym stole zna cię naprawdę", options: ["tak", "jedna osoba", "nikt", "nie chcę żeby wiedzieli"] },
        { text: "Gdybyś mógł zniknąć na te święta zrobiłbyś to", options: ["nie", "na chwilę", "tak", "już to zrobiłem"] },
        { text: "Czy kiedykolwiek udawałeś że jest dobrze", options: ["raz", "wiele razy", "zawsze", "tylko dzisiaj"] },
        { text: "Co słyszysz gdy jest za cicho", options: ["nic", "własne myśli", "coś jeszcze", "głos wiadra"] },
        { text: "Czy boisz się że zostaniesz taki jaki jesteś", options: ["nie", "trochę", "bardzo", "już zostałem"] },

        // 21-23 (Terminal - Extreme Creepy)
        { text: "Czy pamiętasz wszystko ze swojego życia", options: ["tak", "większość", "są luki", "nie chcę pamiętać"] },
        { text: "Czy czujesz że coś w tobie pękło", options: ["nie", "dawno temu", "ostatnio", "nigdy nie było całe"] },
        { text: "Czy Przepotężne Wiadro cię obserwuje", options: ["nie", "to tylko żart", "czasem", "ono zawsze patrzy"] }
    ];

    let currentStep = -1;
    const app = document.getElementById('app');
    const bgEffects = document.getElementById('bg-effects');
    const body = document.body;
    const glitchOverlay = document.getElementById('glitch-overlay');
    
    // --- YOUTUBE API SETUP ---
    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('youtube-audio', {
            height: '0',
            width: '0',
            videoId: CONFIG.youtubeId,
            playerVars: {
                'autoplay': 0,
                'controls': 0,
                'loop': 1,
                'playlist': CONFIG.youtubeId // Wymagane do pętli
            },
            events: {
                'onReady': onPlayerReady
            }
        });
    }

    function onPlayerReady(event) {
        // Player gotowy, ale czekamy na kliknięcie START
        console.log("Audio ready");
    }

    function fadeOutMusic() {
        // Płynne ściszanie muzyki (Fade Out)
        if (!player || typeof player.getVolume !== 'function') return;
        
        let vol = 100;
        const fadeInterval = setInterval(() => {
            vol -= 2;
            if (vol <= 0) {
                player.setVolume(0);
                player.pauseVideo();
                clearInterval(fadeInterval);
            } else {
                player.setVolume(vol);
            }
        }, 100); // Co 100ms zmniejsz głośność
    }

    // --- EFEKTY WIZUALNE ---

    function initSnow() {
        let snowHTML = '';
        for(let i=0; i<40; i++) {
            const left = Math.random() * 100;
            const size = 0.5 + Math.random() * 1;
            const animDur = 5 + Math.random() * 10;
            snowHTML += `<div class="snowflake" style="left: ${left}%; font-size: ${size}rem; animation-duration: ${animDur}s;">❄</div>`;
        }
        bgEffects.innerHTML = snowHTML;
    }

    function triggerHorrorTransition() {
        // Glitch przejścia
        glitchOverlay.classList.add('glitch-active');
        
        // Rozpocznij wyciszanie muzyki
        fadeOutMusic();

        setTimeout(() => {
            // Zmiana motywu na Horror (desaturacja)
            body.classList.remove('theme-festive');
            body.classList.add('theme-horror');
            bgEffects.innerHTML = ''; // Usuń śnieg
            
            renderQuestion(currentStep); // Przerysuj pytanie
            
            setTimeout(() => {
                glitchOverlay.classList.remove('glitch-active');
            }, 500);
        }, 800);
    }

    function triggerTerminalTransition() {
        // Przejście w tryb agresywny
        body.classList.remove('theme-horror');
        body.classList.add('theme-terminal');
    }

    // --- RENDEROWANIE ---

    function startQuiz() {
        if (player && typeof player.playVideo === 'function') {
            player.setVolume(100);
            player.playVideo();
        }
        nextStep();
    }

    function renderStartScreen() {
        initSnow();
        app.innerHTML = `
            <div class="flex flex-col items-center justify-center min-h-[50vh] space-y-8 text-center px-4 animate-[fadeIn_2s_ease-out]">
                <div class="glass-card p-10 rounded-2xl max-w-lg w-full transform hover:scale-[1.01] transition duration-500">
                    <h1 class="text-5xl font-bold text-amber-50 mb-6 drop-shadow-lg tracking-wide">
                        Świąteczny Quiz
                    </h1>
                    <div class="w-20 h-px bg-amber-200/50 mx-auto mb-6"></div>
                    <p class="text-lg text-emerald-100 font-light italic mb-8">
                        Włącz dźwięk. Bądź szczery.
                    </p>
                    <button onclick="startQuiz()" class="px-10 py-3 bg-emerald-900/80 hover:bg-emerald-800 text-amber-50 rounded-full border border-amber-200/20 shadow-xl transition-all font-bold tracking-widest text-sm uppercase">
                        ROZPOCZNIJ
                    </button>
                </div>
            </div>
        `;
    }

    function renderQuestion(index) {
        const q = questions[index];

        // 1. FAZA WESOŁA (0-9)
        if (index < CONFIG.horrorStart) {
            app.innerHTML = `
                <div class="flex flex-col min-h-[60vh] justify-center w-full max-w-xl mx-auto px-4">
                    <div class="glass-card rounded-xl p-8 shadow-2xl relative">
                         <div class="text-center mb-6">
                            <span class="text-amber-200/70 text-xs tracking-[0.3em] uppercase border-b border-amber-200/20 pb-2">Pytanie ${index + 1}</span>
                        </div>
                        <h2 class="text-3xl text-center text-white mb-10 font-serif leading-tight">
                            ${q.text}
                        </h2>
                        <div class="grid gap-4">
                            ${q.options.map((opt, i) => `
                                <button onclick="nextStep()" class="text-left py-4 px-6 bg-emerald-950/30 hover:bg-white/10 border border-white/5 rounded-lg transition-all flex items-center group">
                                    <span class="w-8 h-8 rounded-full border border-amber-200/30 flex items-center justify-center text-sm mr-4 text-amber-100 group-hover:bg-amber-100 group-hover:text-black transition-colors font-serif italic">
                                        ${String.fromCharCode(65 + i)}
                                    </span>
                                    <span class="text-lg text-emerald-50 font-light">${opt}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        } 
        // 2. FAZA HORROR (10-19) - Mało kolorów, cisza
        else if (index < CONFIG.terminalStart) {
            app.innerHTML = `
                <div class="flex flex-col min-h-[60vh] justify-center px-4 font-mono w-full max-w-xl mx-auto">
                    <div class="mb-4 text-xs text-gray-600 tracking-widest text-right border-b border-gray-800 pb-1">
                        PYTANIE_ID_${index + 1}
                    </div>
                    <h2 class="text-2xl font-bold mb-12 text-gray-400 uppercase tracking-wide horror-text">
                        ${q.text}
                    </h2>
                    <div class="grid gap-3 border-l-2 border-gray-800 pl-6">
                        ${q.options.map((opt, i) => `
                            <button onclick="nextStep()" class="text-left py-2 text-gray-500 hover:text-gray-200 hover:pl-2 transition-all duration-300 font-mono text-sm uppercase">
                                <span class="text-gray-800 mr-2">></span> ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        } 
        // 3. FAZA TERMINAL / EXTREME (20+) - Agresywne efekty
        else {
            triggerTerminalTransition(); // Upewnij się, że klasa jest nadana
            app.innerHTML = `
                <div class="flex flex-col min-h-[60vh] justify-center px-4 font-mono w-full extreme-glitch">
                    <h2 class="text-4xl md:text-6xl font-bold mb-16 text-red-600 uppercase text-center leading-none" style="text-shadow: 4px 4px 0 #000;">
                        ${q.text}
                    </h2>
                    <div class="grid gap-6 w-full max-w-lg mx-auto">
                        ${q.options.map((opt, i) => `
                            <button onclick="nextStep()" class="p-4 bg-red-600 text-black hover:bg-black hover:text-red-600 border-4 border-red-600 uppercase font-bold text-xl tracking-widest transition-none transform hover:skew-x-12">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    }

    function renderErrorScreen() {
        app.innerHTML = `
            <div class="flex flex-col justify-center items-center h-screen w-full font-mono px-4 extreme-glitch">
                <div class="text-red-600 text-6xl md:text-9xl font-bold mb-4">ERROR 24</div>
                <div class="bg-red-600 text-black px-4 py-1 text-xl md:text-2xl font-bold mb-12 uppercase">
                    odpowiedź nie została zapisana
                </div>
                <div class="text-red-600 text-lg mb-8 animate-pulse text-center uppercase tracking-widest">
                    czy na pewno chcesz kontynuować
                </div>
                <div class="flex flex-col space-y-4 w-full max-w-xs">
                    ${[1,2,3,4].map(i => `
                        <button onclick="nextStep()" class="w-full py-3 border-2 border-red-600 text-red-600 hover:bg-red-600 hover:text-black uppercase font-bold tracking-[0.5em]">
                            TAK
                        </button>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderFinalInput() {
        app.innerHTML = `
            <div class="flex flex-col justify-center items-center min-h-screen w-full px-4 font-mono extreme-glitch">
                <div class="text-red-600 text-xs tracking-[1em] uppercase mb-12 animate-pulse text-center">
                    PYTANIE USZKODZONE<br>ODPOWIEDŹ WYMAGANA
                </div>
                <h1 class="text-3xl md:text-5xl font-bold text-center text-white mb-16 uppercase leading-tight">
                    WIESZ JUŻ DLACZEGO TU JESTEŚ
                </h1>
                <input type="text" class="w-full max-w-lg bg-black border-b-4 border-red-600 text-center text-red-600 p-4 focus:outline-none font-mono text-2xl uppercase mb-12" placeholder="...">
                <button onclick="endQuiz()" class="text-sm text-gray-500 hover:text-red-600 tracking-[0.5em] uppercase border-b border-transparent hover:border-red-600 pb-2">
                    ZATWIERDŹ
                </button>
            </div>
        `;
    }

    function renderEndScreen() {
        const imgContent = CONFIG.bucketImage 
            ? `<img src="${CONFIG.bucketImage}" alt="Wiadro" class="w-full h-full object-cover grayscale contrast-200 brightness-50">`
            : `<div class="w-full h-full bg-gray-900 border border-red-900"></div>`;

        app.innerHTML = `
            <div class="flex flex-col items-center justify-center min-h-screen w-full bg-black font-mono">
                <div class="relative w-80 h-80 md:w-96 md:h-96 mb-16 extreme-glitch">
                    ${imgContent}
                    <div class="absolute inset-0 bg-red-900/10 mix-blend-overlay"></div>
                </div>
                <div class="text-5xl md:text-8xl font-bold tracking-widest text-red-700 text-center extreme-glitch">
                    ${CONFIG.finalDate}
                </div>
            </div>
        `;
    }

    // --- KONTROLER ---
    function nextStep() {
        currentStep++;

        // 1. Przejście do Horroru (Pytanie 10 -> 11)
        if (currentStep === CONFIG.horrorStart) {
            triggerHorrorTransition();
            return; 
        }

        // 2. Renderowanie
        if (currentStep < questions.length) {
            renderQuestion(currentStep);
        } else if (currentStep === questions.length) {
            renderErrorScreen();
        } else if (currentStep === questions.length + 1) {
            renderFinalInput();
        }
    }

    function endQuiz() {
        app.innerHTML = `<div class="flex items-center justify-center h-screen text-red-600 text-4xl tracking-[1em] extreme-glitch font-mono">...</div>`;
        setTimeout(renderEndScreen, 2000);
    }

    // Załaduj YouTube API
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    // Inicjalizacja
    renderStartScreen();
</script>
